[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qcdrivers"
version = "0.2.3"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
  { name="Jyotirmaya Shivottam", email="shivottam@proton.me" },
]
description = "QCoDeS drivers for instruments used in the SQUAD Lab"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["qcodes", "drivers", "instruments", "SQUAD"]
dependencies = [
  "matplotlib>=3.10.1",
  "numpy>=2.2.4",
  "pandas>=2.2.3",
  "ipykernel>=7.1.0",
  "pyvisa>=1.14.1",
  "pyvisa-py>=0.8.1",
  "qcodes>=0.59.0",
  "requests>=2.32",
  "scipy>=1.15.2",
  "zhinst>=25.1.0",
  "zhinst-qcodes>=0.6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pre-commit>=4",
  # Keep this exact version aligned with pre-commit and GitLab CI.
  "ruff==0.16.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.urls]
"Homepage" = "https://gitlab.com/squad-lab/qcdrivers"
"Bug Tracker" = "https://gitlab.com/squad-lab/qcdrivers/-/issues"
"SQUAD Lab" = "https://squad-lab.org/"

[tool.hatch.build.targets.wheel]
packages = ["src/qcdrivers"]

[tool.semantic_release]
# NOTE: Commit-based versioning. CI owns the version literal above; do not bump
# it by hand, or semantic-release and the tag history will disagree.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}\n\n[skip ci]"
commit_author = "Janitor <squad@fz-juelich.de>"
build_command = "uv build"
tag_format = "v{version}"
# Without `major_on_zero`, the first breaking change after 0.1.0 releases
# 1.0.0; without `allow_zero_version`, semantic-release force-bumps any
# 0.x to 1.0.0 on the next release regardless of the commits.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# preview is the release train: built and tested, never released.
[tool.semantic_release.branches.preview]
match = "preview"
prerelease = true
prerelease_token = "rc"

# Without this, python-semantic-release assumes GitHub and every commit link it
# writes into CHANGELOG.md points at github.com/squad-lab/qcdrivers -- a 404.
[tool.semantic_release.remote]
type = "gitlab"
domain = "gitlab.com"

[tool.semantic_release.changelog]
exclude_commit_patterns = ['^chore\(release\):', '^ruff update$']

[tool.ruff]
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F are ruff's defaults; I adds import sorting.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qcdrivers"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/qcdrivers"]
branch = true

[tool.coverage.report]
show_missing = true
# Hardware drivers cannot be exercised on a CI runner.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
