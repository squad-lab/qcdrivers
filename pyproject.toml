[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivers"
version = "2.0.0"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
]
description = "Drivers for various instruments used in the SQUAD lab"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
keywords = ["qcodes", "drivers", "instruments", "SQUAD"]
dependencies = [
  "qcodes",
  "pyvisa",
  "scipy",
  "numpy",
  "matplotlib",
]

[project.urls]
"Homepage" = "https://gitlab.com/squad-lab/measurements/drivers"
"Bug Tracker" = "https://gitlab.com/squad-lab/measurements/drivers/-/issues"
