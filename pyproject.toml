[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivers"
version = "2.1.0"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
  { name="Lino Visser", email="l.visser@fz-juelich.de" },
]
description = "Drivers for various instruments used in the SQUAD lab"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
keywords = ["qcodes", "drivers", "instruments", "SQUAD"]
dependencies = [
  "matplotlib>=3.10.1",
  "numpy>=2.2.4",
  "pyvisa>=1.14.1",
  "qcodes>=0.45", # ==0.45 required to run plottr in the same venv
  "scipy>=1.15.2",
  "zhinst>=25.1.0",
  "zhinst-qcodes>=0.6.0",
]

[project.urls]
"Homepage" = "https://gitlab.com/squad-lab/measurements/drivers"
"Bug Tracker" = "https://gitlab.com/squad-lab/measurements/drivers/-/issues"

[dependency-groups]
dev = [
    "drivers",
]

[tool.uv.sources]
drivers = { workspace = true }

[tool.uv.workspace]
members = [
    ".",
]
